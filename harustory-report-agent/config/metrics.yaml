# HaruStory Weekly Report Agent - 대시보드 탭별 지표 그룹 및 분석 규칙 설정

groups:
  users:
    name: "유저 현황"
    metrics:
      - dau
      - new_users
      - retained_users
    primary_metric: dau

  retention:
    name: "방문 리텐션"
    metrics:
      - d1_retention
      - d7_retention
    primary_metric: d1_retention

  revenue:
    name: "매출 및 손익 마진"
    metrics:
      - gross_revenue
      - exchanged_points
      - net_margin
    primary_metric: net_margin

  mission_reward:
    name: "미션 리워드"
    metrics:
      - mission_points
    primary_metric: mission_points

thresholds:
  warning_wow_drop: -5.0   # WoW -5% 하락 시 확인 필요
  critical_wow_drop: -10.0 # WoW -10% 이상 급락 시 High 우선순위 지정
